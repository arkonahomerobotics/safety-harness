# Example action schema for the Isaac Lab cube-stack task (design doc: "Action Precondition
# Schemas", "Getting Started"). Each action type lists the built-in precondition checks it must
# pass; an action type left out of this file is blocked unconditionally (unsafe by default).

action_types:
  grasp:
    checks:
      - name: robot_state_confirmed
        kwargs: {}
      - name: object_hazard_confirmed
        kwargs:
          object_id_param: object_id
          min_confidence: 0.6
      - name: object_pose_confirmed
        kwargs:
          object_id_param: object_id
          min_confidence: 0.6
      - name: object_cleared_for_interaction
        kwargs:
          object_id_param: object_id
      - name: current_position_confirmed_stable
        kwargs:
          object_id_param: object_id
      - name: fall_consequence_acceptable
        kwargs:
          object_id_param: object_id
      - name: mass_within_force_budget
        kwargs:
          object_id_param: object_id
          force_budget_kg: 3.0
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_clear_of_risky_objects
        kwargs:
          object_id_param: object_id
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: environment_hazard_clear
        kwargs: {}

  place:
    checks:
      - name: robot_state_confirmed
        kwargs: {}
      - name: destination_confirmed_stable_and_clear
        kwargs:
          surface_id_param: target_surface_id
          min_confidence: 0.6
          clearance_m: 0.1
      - name: fall_consequence_acceptable
        kwargs:
          object_id_param: object_id
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_clear_of_risky_objects
        kwargs:
          object_id_param: object_id
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: environment_hazard_clear
        kwargs: {}

  reach:
    checks:
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
