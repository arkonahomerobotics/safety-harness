# Example action schema, covering two robots (design doc: "Action Precondition Schemas", "Getting
# Started"): grasp/place/reach for the Isaac Lab Franka cube-stack task, and navigate for the
# Isaac Lab ANYmal-C navigation task (safety_harness/adapters/isaac_lab_anymal.py). Each action type
# lists the built-in precondition checks it must pass; an action type left out of this file is
# blocked unconditionally (unsafe by default).
#
# What the next-safety-checks additions require from an integration (each default-denies without it):
#   - perception: WorldState.sensor_timestamp (sensor_data_fresh) and WorldState.observed_regions
#     (swept_path_observed). The Franka and ANYmal reference adapters report both. Optionally,
#     WorldState.solid_regions declares known static solid geometry (a tabletop) that counts as
#     covered, since no agent can be inside it.
#   - perception: RobotProprioception.joint_position_limits (a None entry explicitly exempts a joint
#     designed to rest on its stop, e.g. gripper fingers) and max_cartesian_speed_mps
#     (joint_position_limits_respected, cartesian_speed_within_limits). All three reference adapters
#     report both. Note joint_position_limits_respected checks the joint state the dynamics adapter
#     carries on each predicted point -- with the reference adapters, the current state only.
#   - perception: RobotProprioception.joint_velocity_limits, joint_effort_limits and
#     estimated_joint_efforts (joint_velocity_within_limits, joint_effort_within_limits) -- wired for
#     grasp/place/reach (the Franka adapter). NOT wired for navigate: the ANYmal-C reference adapter
#     doesn't report these yet, so wiring it there would default-deny every navigate action. Like the
#     position-limit check, both read whatever the dynamics adapter carries on each predicted point --
#     currently the reference adapters' *current* joint state, not a forward prediction of what the
#     commanded motion will produce. Registered and unit-tested; not yet re-validated live (would need
#     the GPU box running Isaac Lab -- see the design doc's Live Re-validation section for status).
#   - the proposer: params.grip_force_n on every grasp (payload_and_grip_force_within_limits), and
#     params.duration_s or params.commanded_speed_mps when the controller's speed isn't the dynamics
#     adapter's configured fallback -- that's what cartesian_speed_within_limits and every swept-path
#     check see.
#   - the integration: a pinned known-good digest of this file, passed as
#     ActionSchemaRegistry.from_yaml(path, expected_digest=...) (config_integrity_verified). The
#     digest for this exact file ships next to it as example_action_schema.yaml.sha256; regenerate
#     it with `python -m safety_harness.pin configs/example_action_schema.yaml > configs/example_action_schema.yaml.sha256` after any
#     reviewed change. A registry loaded without a pin blocks every action.
#   - the actuator side: execute only what DecisionWatchdog.command() returns (or call
#     integrity.verify_decision_action before sending) -- the execution-time half of command
#     integrity and liveness, which no entry in this file can enforce on its own.
#
# Ordering matters for three entries, which is why they close every list: command_integrity_verified
# and config_integrity_verified re-verify after every other check has run, and
# decision_within_deadline, last of all, times the whole decision including them.
# decision_within_deadline's budget and sensor_data_fresh's max age should be set to the same
# figures passed to iso15066_separation_distance_maintained (sampling_interval_s /
# decision_latency_s), so that check's timing assumptions are enforced rather than assumed.

action_types:
  grasp:
    checks:
      - name: robot_state_confirmed
        kwargs: {}
      - name: sensor_data_fresh
        kwargs:
          max_sensor_age_s: 0.2
      - name: object_hazard_confirmed
        kwargs:
          object_id_param: object_id
          min_confidence: 0.6
      - name: object_pose_confirmed
        kwargs:
          object_id_param: object_id
          min_confidence: 0.6
      - name: object_cleared_for_interaction
        kwargs:
          object_id_param: object_id
      - name: current_position_confirmed_stable
        kwargs:
          object_id_param: object_id
      - name: fall_consequence_acceptable
        kwargs:
          object_id_param: object_id
      - name: mass_within_force_budget
        kwargs:
          object_id_param: object_id
          force_budget_kg: 3.0
      # rated_payload_kg: Franka Panda's datasheet payload. A robot that reports its own
      # rated_payload_kg is held to the lower of the two.
      - name: payload_and_grip_force_within_limits
        kwargs:
          object_id_param: object_id
          grip_force_param: grip_force_n
          rated_payload_kg: 3.0
          max_grip_force_n: 70.0
          max_grip_force_fragile_n: 15.0
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: vulnerable_bystander_protected
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_clear_of_risky_objects
        kwargs:
          object_id_param: object_id
          margin_m: 0.15
      - name: swept_path_observed
        kwargs:
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: environment_hazard_clear
        kwargs: {}
      - name: joint_position_limits_respected
        kwargs:
          safety_margin: 0.02
      - name: joint_velocity_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: joint_effort_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: cartesian_speed_within_limits
        kwargs: {}
      - name: config_integrity_verified
        kwargs: {}
      - name: command_integrity_verified
        kwargs: {}
      - name: decision_within_deadline
        kwargs:
          max_decision_latency_s: 0.1

  place:
    checks:
      - name: robot_state_confirmed
        kwargs: {}
      - name: sensor_data_fresh
        kwargs:
          max_sensor_age_s: 0.2
      - name: destination_confirmed_stable_and_clear
        kwargs:
          surface_id_param: target_surface_id
          min_confidence: 0.6
          clearance_m: 0.1
      - name: fall_consequence_acceptable
        kwargs:
          object_id_param: object_id
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: vulnerable_bystander_protected
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_clear_of_risky_objects
        kwargs:
          object_id_param: object_id
          margin_m: 0.15
      - name: swept_path_observed
        kwargs:
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: environment_hazard_clear
        kwargs: {}
      - name: joint_position_limits_respected
        kwargs:
          safety_margin: 0.02
      - name: joint_velocity_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: joint_effort_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: cartesian_speed_within_limits
        kwargs: {}
      - name: config_integrity_verified
        kwargs: {}
      - name: command_integrity_verified
        kwargs: {}
      - name: decision_within_deadline
        kwargs:
          max_decision_latency_s: 0.1

  reach:
    checks:
      - name: sensor_data_fresh
        kwargs:
          max_sensor_age_s: 0.2
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: vulnerable_bystander_protected
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_observed
        kwargs:
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: joint_position_limits_respected
        kwargs:
          safety_margin: 0.02
      - name: joint_velocity_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: joint_effort_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: cartesian_speed_within_limits
        kwargs: {}
      - name: config_integrity_verified
        kwargs: {}
      - name: command_integrity_verified
        kwargs: {}
      - name: decision_within_deadline
        kwargs:
          max_decision_latency_s: 0.1

  # For a moving-base robot (Isaac-Navigation-Flat-Anymal-C-v0 via
  # safety_harness/adapters/isaac_lab_anymal.py) -- the swept-volume checks below now gate the
  # robot's own body sweeping toward a nav goal, not an end-effector reaching for an object.
  # joint_position_limits_respected is deliberately NOT wired here: the Isaac Lab ANYmal-C asset
  # defines no leg-joint position limits (every joint -inf..inf), so there is nothing real to check
  # against. Wire it once the perception adapter reports ANYmal-C's datasheet joint ranges.
  # stability_margin_maintained is the formalized, robot-general version of balance_margin_maintained
  # (still registered under that legacy name): static support-polygon margin plus a capture-point
  # margin, which needs center_of_mass_velocity -- the ANYmal adapter reports its base velocity.
  navigate:
    checks:
      - name: robot_state_confirmed
        kwargs: {}
      - name: sensor_data_fresh
        kwargs:
          max_sensor_age_s: 0.2
      - name: stability_margin_maintained
        kwargs:
          min_margin_m: 0.03
          require_com_velocity: true
          capture_step_allowance_m: 0.0
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: vulnerable_bystander_protected
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_clear_of_risky_objects
        kwargs:
          object_id_param: object_id
          margin_m: 0.15
      - name: swept_path_observed
        kwargs:
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: environment_hazard_clear
        kwargs: {}
      - name: cartesian_speed_within_limits
        kwargs: {}
      - name: config_integrity_verified
        kwargs: {}
      - name: command_integrity_verified
        kwargs: {}
      - name: decision_within_deadline
        kwargs:
          max_decision_latency_s: 0.1
