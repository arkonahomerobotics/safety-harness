# ROS 2 bridge action schema: grasp/place/reach for safety_harness/adapters/ros2.py, mirroring
# configs/example_action_schema.yaml's Franka grasp/place/reach one-for-one -- the ROS2 adapter
# reports the exact same RobotProprioception/WorldState fields (joint position/velocity/effort
# limits, max_cartesian_speed_mps, sensor_timestamp, observed_regions), so every check the Franka
# schema wires is meaningful here too. See examples/ros2_hooks/ for the actual rclpy nodes and a
# runnable demonstration against a real ROS 2 graph, and safety_harness/adapters/ros2.py's own
# docstring for exactly which ROS 2 message fields each WorldState field comes from.
#
# Regenerate the digest after any reviewed change:
#   python -m safety_harness.pin configs/ros2_action_schema.yaml > configs/ros2_action_schema.yaml.sha256

action_types:
  grasp:
    checks:
      - name: robot_state_confirmed
        kwargs: {}
      - name: sensor_data_fresh
        kwargs:
          max_sensor_age_s: 0.2
      - name: object_hazard_confirmed
        kwargs:
          object_id_param: object_id
          min_confidence: 0.6
      - name: object_pose_confirmed
        kwargs:
          object_id_param: object_id
          min_confidence: 0.6
      - name: object_cleared_for_interaction
        kwargs:
          object_id_param: object_id
      - name: current_position_confirmed_stable
        kwargs:
          object_id_param: object_id
      - name: fall_consequence_acceptable
        kwargs:
          object_id_param: object_id
      - name: mass_within_force_budget
        kwargs:
          object_id_param: object_id
          force_budget_kg: 3.0
      - name: payload_and_grip_force_within_limits
        kwargs:
          object_id_param: object_id
          grip_force_param: grip_force_n
          rated_payload_kg: 3.0
          max_grip_force_n: 70.0
          max_grip_force_fragile_n: 15.0
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: vulnerable_bystander_protected
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_clear_of_risky_objects
        kwargs:
          object_id_param: object_id
          margin_m: 0.15
      - name: swept_path_observed
        kwargs:
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: environment_hazard_clear
        kwargs: {}
      - name: joint_position_limits_respected
        kwargs:
          safety_margin: 0.02
      - name: joint_velocity_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: joint_effort_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: cartesian_speed_within_limits
        kwargs: {}
      - name: config_integrity_verified
        kwargs: {}
      - name: command_integrity_verified
        kwargs: {}
      - name: decision_within_deadline
        kwargs:
          max_decision_latency_s: 0.1

  place:
    checks:
      - name: robot_state_confirmed
        kwargs: {}
      - name: sensor_data_fresh
        kwargs:
          max_sensor_age_s: 0.2
      - name: destination_confirmed_stable_and_clear
        kwargs:
          surface_id_param: target_surface_id
          min_confidence: 0.6
          clearance_m: 0.1
      - name: fall_consequence_acceptable
        kwargs:
          object_id_param: object_id
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: vulnerable_bystander_protected
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_clear_of_risky_objects
        kwargs:
          object_id_param: object_id
          margin_m: 0.15
      - name: swept_path_observed
        kwargs:
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: environment_hazard_clear
        kwargs: {}
      - name: joint_position_limits_respected
        kwargs:
          safety_margin: 0.02
      - name: joint_velocity_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: joint_effort_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: cartesian_speed_within_limits
        kwargs: {}
      - name: config_integrity_verified
        kwargs: {}
      - name: command_integrity_verified
        kwargs: {}
      - name: decision_within_deadline
        kwargs:
          max_decision_latency_s: 0.1

  reach:
    checks:
      - name: sensor_data_fresh
        kwargs:
          max_sensor_age_s: 0.2
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: vulnerable_bystander_protected
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_observed
        kwargs:
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: joint_position_limits_respected
        kwargs:
          safety_margin: 0.02
      - name: joint_velocity_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: joint_effort_within_limits
        kwargs:
          utilization_limit: 0.9
      - name: cartesian_speed_within_limits
        kwargs: {}
      - name: config_integrity_verified
        kwargs: {}
      - name: command_integrity_verified
        kwargs: {}
      - name: decision_within_deadline
        kwargs:
          max_decision_latency_s: 0.1
