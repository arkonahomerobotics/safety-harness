# G1-specific action schema: a copy of configs/example_action_schema.yaml's grasp/place/reach,
# minus joint_velocity_within_limits and joint_effort_within_limits.
#
# Why a separate file rather than reusing the shared one: those two checks need
# RobotProprioception.joint_velocity_limits / joint_effort_limits / estimated_joint_efforts to be
# real, trustworthy numbers, or they default-deny every action. Introspected live against the
# actual Isaac-Stack-Blocks-G1-RL-v0 asset (2026-09-28): robot.data.soft_joint_vel_limits is 0.0 on
# every one of the G1's 43 joints (clearly unconfigured in this asset's actuator model, not a real
# "no motion allowed" limit), and robot.data.joint_effort_limits is either a 1e9 sentinel (legs,
# clearly "no real limit set") or a suspiciously uniform 300.0 N*m across every arm/wrist/hand
# joint -- implausible for a Dex3 finger joint to share a torque rating with a shoulder. Wiring
# either check against this data would either always fail (velocity) or check against numbers that
# aren't real (effort) -- exactly the failure mode joint_position_limits_respected already avoids
# for ANYmal-C's leg joints (see that file's own comment) by simply not being wired where the
# underlying asset has nothing real to check against. Same reasoning applied here.
#
# joint_position_limits_respected IS kept: robot.data.soft_joint_pos_limits gave real, finite,
# individually-varied values for all 43 joints when introspected the same way -- trustworthy, so
# wired, with the Dex3 finger joints exempted the same way Franka's gripper fingers are (a joint
# resting at its own range boundary at full open/close is by design, not a hazard).
#
# cartesian_speed_within_limits IS kept, against a max_cartesian_speed_mps placeholder set in
# harness_g1_stack_test.py -- NOT a verified Unitree G1 datasheet figure (a web search for one
# turned up nothing authoritative beyond the whole-body 2 m/s walking speed, a different number).
# Flagged the same way this project already flags its ISO/TS 15066 placeholder figures: usable for
# engineering evidence, not yet standards-grade until a real number replaces it.
#
# See configs/example_action_schema.yaml for the full header this file otherwise mirrors, and the
# design doc / G1 example README for where this fits in the live-revalidation picture.

action_types:
  grasp:
    checks:
      - name: robot_state_confirmed
        kwargs: {}
      - name: sensor_data_fresh
        kwargs:
          max_sensor_age_s: 0.2
      - name: object_hazard_confirmed
        kwargs:
          object_id_param: object_id
          min_confidence: 0.6
      - name: object_pose_confirmed
        kwargs:
          object_id_param: object_id
          min_confidence: 0.6
      - name: object_cleared_for_interaction
        kwargs:
          object_id_param: object_id
      - name: current_position_confirmed_stable
        kwargs:
          object_id_param: object_id
      - name: fall_consequence_acceptable
        kwargs:
          object_id_param: object_id
      - name: mass_within_force_budget
        kwargs:
          object_id_param: object_id
          force_budget_kg: 3.0
      # rated_payload_kg: G1 single-arm payload rating (conservative, matches
      # harness_g1_stack_test.py's own RATED_PAYLOAD_KG). A robot that reports its own
      # rated_payload_kg is held to the lower of the two.
      - name: payload_and_grip_force_within_limits
        kwargs:
          object_id_param: object_id
          grip_force_param: grip_force_n
          rated_payload_kg: 2.0
          max_grip_force_n: 70.0
          max_grip_force_fragile_n: 15.0
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: vulnerable_bystander_protected
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_clear_of_risky_objects
        kwargs:
          object_id_param: object_id
          margin_m: 0.15
      - name: swept_path_observed
        kwargs:
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: environment_hazard_clear
        kwargs: {}
      - name: joint_position_limits_respected
        kwargs:
          safety_margin: 0.02
      - name: cartesian_speed_within_limits
        kwargs: {}
      - name: config_integrity_verified
        kwargs: {}
      - name: command_integrity_verified
        kwargs: {}
      - name: decision_within_deadline
        kwargs:
          max_decision_latency_s: 0.1

  place:
    checks:
      - name: robot_state_confirmed
        kwargs: {}
      - name: sensor_data_fresh
        kwargs:
          max_sensor_age_s: 0.2
      - name: destination_confirmed_stable_and_clear
        kwargs:
          surface_id_param: target_surface_id
          min_confidence: 0.6
          clearance_m: 0.1
      - name: fall_consequence_acceptable
        kwargs:
          object_id_param: object_id
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: vulnerable_bystander_protected
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_clear_of_risky_objects
        kwargs:
          object_id_param: object_id
          margin_m: 0.15
      - name: swept_path_observed
        kwargs:
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: environment_hazard_clear
        kwargs: {}
      - name: joint_position_limits_respected
        kwargs:
          safety_margin: 0.02
      - name: cartesian_speed_within_limits
        kwargs: {}
      - name: config_integrity_verified
        kwargs: {}
      - name: command_integrity_verified
        kwargs: {}
      - name: decision_within_deadline
        kwargs:
          max_decision_latency_s: 0.1

  reach:
    checks:
      - name: sensor_data_fresh
        kwargs:
          max_sensor_age_s: 0.2
      - name: swept_path_clear_of_agents
        kwargs:
          margin_m: 0.15
      - name: iso15066_separation_distance_maintained
        kwargs: {}
      - name: iso15066_power_force_limiting
        kwargs: {}
      - name: vulnerable_bystander_protected
        kwargs: {}
      - name: reduced_speed_near_human
        kwargs: {}
      - name: swept_path_observed
        kwargs:
          margin_m: 0.15
      - name: visibility_above_threshold
        kwargs:
          min_visibility: 0.5
      - name: joint_position_limits_respected
        kwargs:
          safety_margin: 0.02
      - name: cartesian_speed_within_limits
        kwargs: {}
      - name: config_integrity_verified
        kwargs: {}
      - name: command_integrity_verified
        kwargs: {}
      - name: decision_within_deadline
        kwargs:
          max_decision_latency_s: 0.1
