[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-harness"
version = "0.3.14"
description = "A perception-grounded safety harness for physical AI: default-deny precondition gate for actuators, permission not detection."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Kaoru Naganuma", email = "kaoru.naganuma@gmail.com" }]
keywords = ["robotics", "safety", "physical-ai", "isaac-lab", "iso-15066"]
dependencies = ["pyyaml>=6.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
safety-harness-conformance = "safety_harness.conformance.__main__:main"

[project.urls]
Homepage = "https://github.com/arkonahomerobotics/safety-harness"
Repository = "https://github.com/arkonahomerobotics/safety-harness"
Issues = "https://github.com/arkonahomerobotics/safety-harness/issues"
"Design doc" = "https://github.com/arkonahomerobotics/safety-harness/blob/main/docs/design.md"

[tool.setuptools.packages.find]
include = ["safety_harness*"]
